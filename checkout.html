<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUXOR — Finalizar compra</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080808;
  color:#f5f5f5;
  line-height:1.5
}
.wrap{
  max-width:1050px;
  margin:auto;
  padding:30px 18px 60px
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:28px
}
.logo{
  color:#c9a45c;
  font-size:25px;
  font-weight:800;
  letter-spacing:6px
}
.back{
  color:#c9a45c;
  text-decoration:none
}
.grid{
  display:grid;
  grid-template-columns:1fr 360px;
  gap:22px
}
.card{
  background:#111;
  border:1px solid #242424;
  border-radius:14px;
  padding:24px
}
.card h1,.card h2{
  margin-bottom:18px
}
.card h1{
  font-size:28px
}
.card h2{
  font-size:18px;
  color:#c9a45c
}
.form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}
.full{
  grid-column:1/-1
}
label{
  display:block;
  font-size:12px;
  color:#aaa;
  margin-bottom:6px
}
input,select{
  width:100%;
  padding:13px;
  border-radius:8px;
  border:1px solid #333;
  background:#090909;
  color:#fff;
  outline:none
}
input:focus,select:focus{
  border-color:#c9a45c
}
.summary{
  position:sticky;
  top:90px;
  height:max-content
}
.product{
  display:flex;
  gap:12px;
  border-bottom:1px solid #292929;
  padding-bottom:15px;
  margin-bottom:15px
}
.product img{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:8px;
  background:#181818
}
.muted{
  color:#aaa;
  font-size:13px
}
.price{
  color:#f0d38a;
  font-size:20px;
  font-weight:800;
  margin:12px 0 20px
}
.submit{
  width:100%;
  padding:15px;
  border:0;
  border-radius:8px;
  background:#c9a45c;
  color:#090909;
  font-weight:800;
  cursor:pointer
}
.submit:disabled{
  opacity:.6;
  cursor:not-allowed
}
.msg{
  margin-top:14px;
  padding:12px;
  border-radius:8px;
  display:none
}
.ok{
  display:block;
  background:#102414;
  color:#b9e7c0
}
.err{
  display:block;
  background:#321515;
  color:#ffc5c5
}

@media(max-width:800px){
  .grid{
    grid-template-columns:1fr
  }
  .summary{
    position:static
  }
  .form{
    grid-template-columns:1fr
  }
  .full{
    grid-column:auto
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <a class="logo" href="index.html">LUXOR</a>
    <a class="back" href="index.html">← Voltar à loja</a>
  </div>

  <div class="grid">

    <section class="card">

      <h1>Seus dados</h1>

      <p class="muted" style="margin-bottom:20px">
        Preencha os dados para registrar seu pedido.
      </p>

      <form id="checkoutForm" class="form">

        <div>
          <label for="nome">Nome completo *</label>
          <input
            id="nome"
            name="nome"
            required
            autocomplete="name"
          >
        </div>

        <div>
          <label for="email">E-mail *</label>
          <input
            id="email"
            name="email"
            type="email"
            required
            autocomplete="email"
          >
        </div>

        <div>
          <label for="telefone">Telefone *</label>
          <input
            id="telefone"
            name="telefone"
            required
            autocomplete="tel"
          >
        </div>

        <div>
          <label for="cpf">CPF *</label>
          <input
            id="cpf"
            name="cpf"
            inputmode="numeric"
            autocomplete="off"
            required
          >
        </div>

        <div>
          <label for="cep">CEP *</label>
          <input
            id="cep"
            name="cep"
            required
            autocomplete="postal-code"
          >
        </div>

        <div>
          <label for="estado">Estado *</label>

          <select id="estado" name="estado" required>

            <option value="">Selecione</option>

            <option>AC</option>
            <option>AL</option>
            <option>AP</option>
            <option>AM</option>
            <option>BA</option>
            <option>CE</option>
            <option>DF</option>
            <option>ES</option>
            <option>GO</option>
            <option>MA</option>
            <option>MT</option>
            <option>MS</option>
            <option>MG</option>
            <option>PA</option>
            <option>PB</option>
            <option>PR</option>
            <option>PE</option>
            <option>PI</option>
            <option>RJ</option>
            <option>RN</option>
            <option>RS</option>
            <option>RO</option>
            <option>RR</option>
            <option>SC</option>
            <option>SP</option>
            <option>SE</option>
            <option>TO</option>

          </select>
        </div>

        <div class="full">
          <label for="endereco">Endereço *</label>

          <input
            id="endereco"
            name="endereco"
            required
            autocomplete="street-address"
          >
        </div>

        <div>
          <label for="numero">Número *</label>

          <input
            id="numero"
            name="numero"
            required
          >
        </div>

        <div>
          <label for="complemento">Complemento</label>

          <input
            id="complemento"
            name="complemento"
          >
        </div>

        <div>
          <label for="cidade">Cidade *</label>

          <input
            id="cidade"
            name="cidade"
            required
            autocomplete="address-level2"
          >
        </div>

        <div class="full">

          <button
            class="submit"
            id="submitBtn"
            type="submit"
          >
            CONTINUAR PARA PAGAMENTO
          </button>

        </div>

        <div
          id="msg"
          class="msg full"
        ></div>

      </form>

    </section>

    <aside class="card summary">

      <h2>Seu pedido</h2>

      <div id="productBox"></div>

      <div
        class="price"
        id="total"
      >
        R$ 0,00
      </div>

      <p class="muted">
        Após concluir, você será direcionado ao checkout seguro do PagBank para escolher Pix, cartão ou boleto.
      </p>

    </aside>

  </div>

</div>

<script>

const produto =
  JSON.parse(
    localStorage.getItem("produtoSelecionado") || "null"
  );

const box =
  document.getElementById("productBox");

const total =
  document.getElementById("total");

const submitBtn =
  document.getElementById("submitBtn");

const msg =
  document.getElementById("msg");


/* =====================================================
   PRODUTO
===================================================== */

if (!produto) {

  box.innerHTML =
    '<p class="muted">Nenhum produto selecionado.</p>';

  submitBtn.disabled = true;

} else {

  const img =
    produto.imagens?.[0] ||
    produto.imagem ||
    "";

  box.innerHTML = `
    <div class="product">

      <img
        src="${img}"
        alt=""
      >

      <div>

        <strong>
          ${produto.nome}
        </strong>

        <div class="muted">
          Quantidade: 1
        </div>

      </div>

    </div>
  `;

  total.textContent =
    Number(produto.preco).toLocaleString(
      "pt-BR",
      {
        style: "currency",
        currency: "BRL"
      }
    );
}


/* =====================================================
   ENVIO DO PEDIDO
===================================================== */

document
  .getElementById("checkoutForm")
  .addEventListener("submit", async function(e) {

    e.preventDefault();

    if (!produto) {
      return;
    }

    submitBtn.disabled = true;

    msg.className = "msg";

    msg.textContent =
      "Registrando pedido...";

    try {

      const dados =
        Object.fromEntries(
          new FormData(e.target).entries()
        );


      /* =================================================
         FORMATO CORRETO PARA O SERVER.JS
      ================================================= */

      const pedido = {

        produto_id:
          produto.id || null,

        produto_nome:
          produto.nome,

        quantidade:
          1,

        valor:
          Number(produto.preco),

        nome:
          dados.nome,

        email:
          dados.email,

        telefone:
          dados.telefone,

        cpf:
          dados.cpf,

        cep:
          dados.cep,

        endereco:
          dados.endereco,

        numero:
          dados.numero,

        complemento:
          dados.complemento,

        cidade:
          dados.cidade,

        estado:
          dados.estado
      };


      console.log(
        "Enviando pedido:",
        pedido
      );


      const resposta =
        await fetch(
          "/api/pedidos",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "Accept":
                "application/json"
            },

            body:
              JSON.stringify(pedido)
          }
        );


      /* =================================================
         LER RESPOSTA
      ================================================= */

      const texto =
        await resposta.text();

      let resultado;

      try {

        resultado =
          JSON.parse(texto);

      } catch {

        resultado = {
          erro: texto
        };

      }


      console.log(
        "Resposta do servidor:",
        resposta.status,
        resultado
      );


      if (!resposta.ok) {

        throw new Error(
          resultado.erro ||
          resultado.error ||
          "Não foi possível registrar o pedido."
        );

      }


      /* =================================================
         PEDIDO CRIADO
      ================================================= */

      const pedidoId =
        resultado.pedido_id;

      const checkoutId =
        resultado.checkout_id || "";

      const paymentLink =
        resultado.payment_link || "";


      localStorage.setItem(
        "pedidoId",
        pedidoId || ""
      );

      localStorage.setItem(
        "pagbankCheckoutId",
        checkoutId
      );


      /* =================================================
         PAGAMENTO
      ================================================= */

      if (!paymentLink) {

        throw new Error(
          "Pedido criado, mas o PagBank não retornou o link de pagamento."
        );

      }


      msg.className =
        "msg ok";

      msg.textContent =
        "Pedido nº " +
        pedidoId +
        " criado. Redirecionando para o pagamento seguro...";


      setTimeout(() => {

        window.location.href =
          paymentLink;

      }, 500);


    } catch (erro) {

      console.error(
        "Erro no checkout:",
        erro
      );

      msg.className =
        "msg err";

      msg.textContent =
        erro.message ||
        "Não foi possível registrar o pedido.";

      submitBtn.disabled = false;

    }

  });

</script>

</body>
</html>

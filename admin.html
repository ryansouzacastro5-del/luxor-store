<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUXOR • Painel Administrativo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1400px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.logo{font-size:25px;letter-spacing:6px;color:#d2ad68;font-weight:800}.sub{color:#888;font-size:13px;margin-top:6px}.btn{border:1px solid #3b3b3b;background:#141414;color:#eee;padding:11px 15px;border-radius:7px;cursor:pointer}.btn:hover{border-color:#d2ad68;color:#d2ad68}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.card{background:#111;border:1px solid #252525;border-radius:12px;padding:20px}.label{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:1px}.value{font-size:28px;font-weight:800;margin-top:8px;color:#d2ad68}.tools{background:#111;border:1px solid #252525;border-radius:12px;padding:16px;margin-bottom:18px;display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:10px}.tools input,.tools select{width:100%;background:#090909;color:#eee;border:1px solid #333;border-radius:7px;padding:12px}.table-wrap{background:#111;border:1px solid #252525;border-radius:12px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1050px}.table th,.table td{padding:14px 12px;border-bottom:1px solid #222;text-align:left;font-size:13px}.table th{color:#999;font-size:11px;text-transform:uppercase;letter-spacing:.8px}.table tr:hover td{background:#151515}.paid{color:#7bd88f;font-weight:700}.detail{margin-top:18px;background:#111;border:1px solid #252525;border-radius:12px;padding:20px;display:none}.detail h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{background:#090909;border:1px solid #222;border-radius:8px;padding:12px}.field b{display:block;color:#888;font-size:11px;text-transform:uppercase;margin-bottom:5px}.field span{word-break:break-word}.empty{padding:35px;text-align:center;color:#888}.status{padding:5px 8px;border-radius:20px;background:#18351f;color:#7bd88f;font-size:11px;font-weight:700}.error{color:#ff8585;padding:10px 0}.hint{color:#777;font-size:12px;margin-top:8px}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.wrap{padding:16px}.top{align-items:flex-start}.cards{grid-template-columns:1fr 1fr}.tools{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.value{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div><div class="logo">LUXOR</div><div class="sub">Painel administrativo • somente pagamentos aprovados</div></div><button class="btn" onclick="location.reload()">Atualizar</button></header>
<section class="cards"><div class="card"><div class="label">Vendas aprovadas</div><div id="qtd" class="value">—</div></div><div class="card"><div class="label">Total recebido</div><div id="total" class="value">—</div></div><div class="card"><div class="label">Clientes</div><div id="clientes" class="value">—</div></div><div class="card"><div class="label">Última venda</div><div id="ultima" class="value" style="font-size:18px">—</div></div></section>
<section class="tools"><input id="busca" placeholder="Buscar por pedido, nome, CPF, e-mail..." oninput="carregar()"><input id="inicio" type="date" onchange="carregar()"><input id="fim" type="date" onchange="carregar()"><button class="btn" onclick="limpar()">Limpar</button></section>
<div id="erro" class="error"></div>
<section class="table-wrap"><table class="table"><thead><tr><th>Pedido</th><th>Data</th><th>Cliente</th><th>Produto</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody id="lista"><tr><td colspan="7" class="empty">Carregando...</td></tr></tbody></table></section>
<section id="detalhe" class="detail"></section>
</div>
<script>
const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0));
const date=v=>v?new Date(v).toLocaleString('pt-BR'):'—';
async function api(url){const r=await fetch(url);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Erro ao consultar o servidor.');return d}
function params(){const p=new URLSearchParams();const q=document.getElementById('busca').value.trim();const a=document.getElementById('inicio').value;const b=document.getElementById('fim').value;if(q)p.set('q',q);if(a)p.set('inicio',a);if(b)p.set('fim',b);return p.toString()}
async function carregar(){document.getElementById('erro').textContent='';try{const [res,rows]=await Promise.all([api('/api/admin/resumo?'+params()),api('/api/admin/pedidos?'+params())]);document.getElementById('qtd').textContent=res.quantidade;document.getElementById('total').textContent=money(res.total);document.getElementById('clientes').textContent=res.clientes;document.getElementById('ultima').textContent=res.ultima?date(res.ultima):'—';const body=document.getElementById('lista');if(!rows.length){body.innerHTML='<tr><td colspan="7" class="empty">Nenhuma venda aprovada encontrada.</td></tr>';return}body.innerHTML=rows.map(x=>`<tr><td>#${x.id}</td><td>${date(x.criado_em)}</td><td>${esc(x.nome)}</td><td>${esc(x.produto_nome)}</td><td>${money(x.valor)}</td><td><span class="status">PAGO</span></td><td><button class="btn" onclick="ver(${x.id})">Ver dados</button></td></tr>`).join('')}catch(e){document.getElementById('erro').textContent=e.message}}
async function ver(id){try{const x=await api('/api/admin/pedidos/'+id);const d=document.getElementById('detalhe');d.style.display='block';d.innerHTML='<h2>Pedido #'+x.id+'</h2><div class="hint">Pagamento aprovado. Dados completos do cliente.</div><div class="grid">'+field('Cliente',x.nome)+field('E-mail',x.email)+field('Telefone',x.telefone)+field('CPF',x.cpf)+field('CEP',x.cep)+field('Endereço',x.endereco)+field('Número',x.numero)+field('Complemento',x.complemento)+field('Cidade',x.cidade)+field('Estado',x.estado)+field('Produto',x.produto_nome)+field('Valor',money(x.valor))+field('Data',date(x.criado_em))+field('Status',x.status)+field('PagBank checkout',x.pagbank_checkout_id)+field('Payment status',x.payment_status)+'</div>' ;d.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){document.getElementById('erro').textContent=e.message}}
function field(k,v){return `<div class="field"><b>${k}</b><span>${esc(v??'—')}</span></div>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function limpar(){document.getElementById('busca').value='';document.getElementById('inicio').value='';document.getElementById('fim').value='';carregar()}
carregar();
</script>
</body>
</html>
